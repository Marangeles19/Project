name: CI/CD - Docker Build & Deploy

on:
  push:
    branches:
      - dev  # O la rama que estés utilizando

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # ✅ 1. Checkout del código
      - name: Checkout code
        uses: actions/checkout@v2

      # ✅ 2. Login en Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ✅ 3. Construir y subir la imagen del **Backend (Node.js)**
      - name: Build and Push Server Docker Image
        run: |
          IMAGE_TAG_SERVER="${{ secrets.DOCKER_USERNAME }}/server:latest"
          
          # Construir la imagen del servidor
          docker build -f server/Dockerfile -t $IMAGE_TAG_SERVER server/
          
          # Verificar si la imagen ya existe en Docker Hub
          LOCAL_SERVER_IMAGE_HASH=$(docker images --no-trunc --quiet $IMAGE_TAG_SERVER)
          REMOTE_SERVER_IMAGE_HASH=$(docker pull $IMAGE_TAG_SERVER || echo "Image not found")

          if [[ "$LOCAL_SERVER_IMAGE_HASH" != "$REMOTE_SERVER_IMAGE_HASH" ]]; then
            echo "Pushing the server image to Docker Hub"
            docker push $IMAGE_TAG_SERVER
          else
            echo "La imagen del servidor ya está actualizada. Skipping push."
          fi

      # ✅ 4. Construir y subir la imagen del **Frontend (React)**
      - name: Build and Push Client Docker image
        run: |
          IMAGE_TAG_CLIENT="${{ secrets.DOCKER_USERNAME }}/cliente:latest"
          
          # Construir la imagen del cliente
          docker build -f client/Dockerfile -t $IMAGE_TAG_CLIENT .
          
          # Verificar si la imagen ya existe en Docker Hub
          LOCAL_CLIENT_IMAGE_HASH=$(docker images --no-trunc --quiet $IMAGE_TAG_CLIENT)
          REMOTE_CLIENT_IMAGE_HASH=$(docker pull $IMAGE_TAG_CLIENT || echo "Image not found")

          if [[ "$LOCAL_CLIENT_IMAGE_HASH" != "$REMOTE_CLIENT_IMAGE_HASH" ]]; then
            echo "Pushing the client image to Docker Hub"
            docker push $IMAGE_TAG_CLIENT
          else
            echo "La imagen del cliente ya está actualizada. Skipping push."
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: SSH into EC2 and Deploy Containers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_CLIENT_SERVER }}
          username: ubuntu
          key: ${{ secrets.CLIENT_SERVER_KEY }}
          script: |
            # ✅ Instalar Docker si no está instalado
            if ! command -v docker &> /dev/null; then
              sudo apt update
              sudo apt install -y docker.io
              sudo systemctl enable --now docker
            fi
            # Hacer que Docker se inicie automáticamente
            sudo systemctl enable --now docker

            # ✅ Descargar las últimas imágenes
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/cliente:latest
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/server:latest

            # Verificar si las imágenes fueron descargadas correctamente
            sudo docker images

            # Detener y eliminar los contenedores existentes por nombre
            sudo docker stop cliente || true
            sudo docker rm cliente || true
            sudo docker stop server || true
            sudo docker rm server || true

            # Verificar las variables de entorno antes de generar el archivo
            echo "Base de datos: $MONGO_URI"

            # Crear el archivo .env dentro de la carpeta src
            echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> .env
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env
            echo "NODE_ENV=${{ secrets.NODE_ENV }}" >> .env
            echo "SMTP_USER=${{ secrets.SMTP_USER }}" >> .env
            echo "SMTP_PASS=${{ secrets.SMTP_PASS }}" >> .env
            echo "SENDER_EMAIL=${{ secrets.SENDER_EMAIL }}" >> .env

            # Verificar que el archivo .env se ha creado correctamente
            cat .env

            # ✅ Iniciar el Backend (Node.js) con `.env`
            sudo docker run -d -p 4000:4000 --env-file .env --name server ${{ secrets.DOCKER_USERNAME }}/server:latest

            # ✅ Iniciar el Frontend (React) en puerto `80` (sin `.env`)
            sudo docker run -d -p 8080:80 --name cliente ${{ secrets.DOCKER_USERNAME }}/cliente:latest

            # ✅ Verificar que los contenedores están corriendo
            sudo docker ps -a