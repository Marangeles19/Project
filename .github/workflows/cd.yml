name: Deploy to EC2 from Docker Hub

on:
  push:
    branches:
      - dev

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          # Construye la imagen desde el Dockerfile dentro de server/
          docker build -f server/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/server:latest server/
          docker push ${{ secrets.DOCKER_USERNAME }}/server:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: SSH into EC2 and Deploy Containers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_BACKEND_IP }}
          username: ubuntu
          key: ${{ secrets.EC2_BACKENDKEY }}
          script: |
            # ✅ Instalar Docker si no está instalado
            if ! command -v docker &> /dev/null; then
              sudo apt update
              sudo apt install -y docker.io
              sudo systemctl enable --now docker
            fi

            # ✅ Descargar la última versión de la imagen
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/server:latest

            # ✅ Detener y eliminar contenedores antiguos si existen
            sudo docker stop server || true
            sudo docker rm server || true

            # ✅ Ejecutar el contenedor correctamente con mapeo de puerto 4800
            sudo docker run -d \
              --name server \
              -p 4800:4800 \
              ${{ secrets.DOCKER_USERNAME }}/server:latest
