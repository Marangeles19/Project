name: Deploy to EC2 from Docker Hub

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      run: |
        # Usar Dockerfile ubicado en server/ y establecer server/ como contexto
        docker build -f server/Dockerfile -t ${{ secrets.DOCKER_USERNAME }}/server:latest server/
        docker push ${{ secrets.DOCKER_USERNAME }}/server:latest

    - name: SSH into EC2 and pull the latest Docker image
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.EC2_BACKEND_IP }}
        username: ubuntu
        key: ${{ secrets.EC2_BACKENDKEY }}
        script: |
          # Instalar Docker si no está disponible
          if ! command -v docker &> /dev/null; then
            sudo apt update
            sudo apt install -y docker.io
            sudo systemctl start docker
            sudo systemctl enable docker
            sudo usermod -aG docker $USER
            sudo systemctl restart docker
          else
            echo "Docker ya está instalado"
          fi
          
          # Asegurarse de que Docker esté activo
          if ! sudo systemctl is-active --quiet docker; then
            sudo systemctl start docker
          fi  

          # Obtener última imagen
          sudo docker pull ${{ secrets.DOCKER_USERNAME }}/server:latest

          # Detener contenedores en ejecución
          sudo docker stop $(docker ps -q) || true

          # Ejecutar nuevo contenedor
          sudo docker run -d -p 80:80 ${{ secrets.DOCKER_USERNAME }}/server:latest
